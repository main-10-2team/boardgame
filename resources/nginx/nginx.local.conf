events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied any;
    gzip_vary on;

    upstream django_server {
        server django:8000;
    }

    # HTTP (80) 요청을 HTTPS (443)로 리다이렉트하는 설정
    server {
        listen 80;
        server_name boardq.o-r.kr;

        # HTTP 요청을 HTTPS로 301 영구 이동시킴
        return 301 https://$host$request_uri;
    }

    # HTTPS (443)를 위한 새로운 server 블록
    server {
        listen 443 ssl;
        server_name boardq.o-r.kr;

        # SSL 인증서와 키 파일 경로 지정
        ssl_certificate /etc/letsencrypt/live/boardq.o-r.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/boardq.o-r.kr/privkey.pem;

        # SSL 관련 보안 설정
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH";
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://django_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
        }

        location /static/ {
            alias /boardq/static/;
            autoindex off;
            expires 1d;
            access_log off;
        }

        location /media/ {
            alias /boardq/media/;
            autoindex off;
            expires 1d;
            access_log off;
        }
    }
}